<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos.css">
    <title>Calculadora de Gastos</title>
</head>
<body>
    <section>
        <h2>Calculadora de gastos</h2>
        <div>
            <label for="descripcion">Describa el gasto</label>
            <input id="descripcion" placeholder="En que gasto dinero" type="text">
        </div>

        <div>
            <label for="monto">Monto:</label>
            <input type="number" id="monto" placeholder="ej: 5000">
        </div>
        <div>
            <label for="categoria">Categoría:</label>
            <select id="categoria">
                <option value="Comida">Comida</option>
                <option value="Transporte">Transporte</option>
                <option value="Entretenimiento">Entretenimiento</option>
                <option value="Servicios">Servicios</option>
                <option value="Otros">Otros</option>
            </select>
        </div>
        <button id="btnAgregar">Agregar Gasto</button>
    </section>

    <section>
        <h2>Total Gasto</h2>
         <div id="totalHoy"></div>
         <div id="totalMes"></div>
         <div id="totalesCategoria"></div>
    </section>

    <section>
        <h2>Historial de Gastos</h2>
         <div id="listaGastos"></div>
    </section>

     <script src="script.js"></script>
</body>
</html>
